plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dbrlwns'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // Markdown -> HTML (CKEditor 대체)
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'

    // 스키마는 Flyway 가 만들고 Hibernate 는 검사만 한다(ddl-auto: validate).
    // 독립적인 둘이 일치해야 앱이 뜨므로, 마이그레이션과 엔티티가 어긋나면
    // 잘못된 스키마로 도는 대신 부팅이 멈춘다.
    implementation 'org.flywaydb:flyway-core'

    // Flyway 10 부터 DB 별 지원이 별도 모듈로 쪼개졌다. core 에는 H2 가 들어 있어서
    // 로컬에서는 멀쩡히 돌지만, PostgreSQL 로 붙이면 기동하면서
    // "Unsupported Database: PostgreSQL 16.13" 으로 죽는다.
    // 실제 PostgreSQL 에 띄워 보고서야 발견했다.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 소스에 한글 주석이 많다. 인코딩을 명시하지 않으면 플랫폼 기본값을 따르는데,
// 윈도우에서 구형 JDK 나 일부 도구 조합이면 MS949 로 읽혀 주석이 깨지고
// 컴파일 에러까지 난다. 어느 OS 에서 빌드하든 UTF-8 로 고정한다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

// 개발 실행은 항상 local 프로파일로 띄운다.
// application-local.yml 은 .gitignore 에 있어서 관리자 계정 같은 개인 설정을
// 커밋하지 않고 둘 수 있다. 그 파일이 없어도 에러가 아니라 application.yml 만 쓴다.
// 배포는 bootRun 이 아니라 jar 로 하므로 운영에는 영향이 없다.
tasks.named('bootRun') {
    args '--spring.profiles.active=local'
}
