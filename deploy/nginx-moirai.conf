# nginx 사이트 설정. /etc/nginx/sites-available/moirai 로 복사하고
# /etc/nginx/sites-enabled/ 에 심볼릭 링크를 건다.
#
#   sudo ln -s /etc/nginx/sites-available/moirai /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t          # 문법 검사. 반드시 먼저
#   sudo systemctl reload nginx
#
# 아래 server_name 두 군데를 실제 도메인으로 바꾼다.
#
# 이 파일에는 443 블록이 없다. certbot 이 인증서를 발급하면서 자동으로
# 443 블록을 만들고 80 을 리다이렉트로 바꿔 준다. 먼저 80 으로만 뜨게 한 뒤
#   sudo certbot --nginx -d moirai.kr -d www.moirai.kr
# 를 돌리는 순서다. 인증서 발급은 80 포트로 도메인 소유를 확인하므로
# DNS 가 이 서버를 가리킨 뒤에 해야 한다.

server {
    listen 80;
    listen [::]:80;
    server_name moirai.kr www.moirai.kr;

    # 응답 헤더에서 nginx 버전을 숨긴다.
    server_tokens off;

    # 본문이 긴 스토리를 저장할 때를 위해. 기본 1m 이면 긴 글에서 413 이 날 수 있다.
    client_max_body_size 4m;

    # 텍스트만 압축한다. 이미지는 이미 압축돼 있어 CPU 만 쓴다.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 아래 네 줄이 핵심이다.
        #
        # nginx 가 TLS 를 끝내고 앱에는 평문으로 넘기므로, 원래 요청이
        # https 였다는 사실을 헤더로 알려 줘야 한다. 이게 없으면
        # application-prod.yml 의 forward-headers-strategy 가 볼 것이 없고,
        # og:url 이 http:// 로 나간다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 앱이 재시작 중일 때 조금 기다려 준다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 정적 파일은 오래 캐시한다. 파일명이 바뀌지 않으므로 길게 잡으면
    # CSS 를 고쳤을 때 안 바뀌어 보인다. 1시간이 타협점이다.
    location ~* ^/(css|js|favicon\.svg|favicon-32\.png|apple-touch-icon\.png) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    # 관리 화면은 검색엔진이 올 이유가 없다. 앱도 noindex 를 내보내지만
    # 여기서 한 겹 더 둔다.
    location /admin {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
