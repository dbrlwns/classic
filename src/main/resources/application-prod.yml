# 운영 프로파일.
spring:
  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  # 마이그레이션은 로컬과 같은 파일을 같은 순서로 돌린다.
  # 첫 배포 때 V1(스키마)과 V2(카탈로그)가 들어가고, 그 뒤로는 새로 추가된
  # V 파일만 실행된다. 로컬과 운영의 스키마가 갈라질 길이 없다.
  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: true

# 프록시(nginx) 뒤에서 돈다.
#
# nginx 가 TLS 를 끝내고 앱에는 평문 http 로 넘긴다. 그래서 앱이 보는 요청은
# 전부 http 이고, 요청에서 주소를 뽑는 og:url 이 https 가 아니라 http 로 나간다.
# 공유 카드와 검색 결과에 http 주소가 박히는 것은 물론, 브라우저가 혼합 콘텐츠로
# 막는 경우도 생긴다.
#
# framework 로 두면 스프링이 X-Forwarded-Proto / X-Forwarded-Host 를 보고
# 원래 요청이 무엇이었는지 복원한다. nginx 쪽에서 그 헤더를 반드시 넣어 줘야 한다
# (deploy/nginx-moirai.conf 참고). 헤더를 안 보내면서 이 설정만 켜면 소용이 없고,
# 반대로 아무나 그 헤더를 보낼 수 있는 자리에 앱을 노출하면 위조될 수 있다.
# 앱은 127.0.0.1 에만 바인딩하고 nginx 만 통하게 한다.
server:
  forward-headers-strategy: framework

  # 포트를 플랫폼이 정해 주는 경우가 있다.
  #
  # Railway 같은 PaaS 는 컨테이너마다 포트를 배정하고 PORT 환경변수로 알려준다.
  # 그 포트로 듣지 않으면 플랫폼이 앱을 찾지 못해 "no healthy upstream" 이 뜬다.
  # 직접 띄우는 서버(Oracle 등)에서는 PORT 가 없으므로 8080 으로 떨어진다.
  port: ${PORT:8080}

  # 주소(server.address)는 여기서 정하지 않는다. 환경마다 반대이기 때문이다.
  #
  #   직접 띄우는 서버  127.0.0.1  — nginx 만 통하게 가둔다
  #   PaaS             0.0.0.0    — 플랫폼 프록시가 컨테이너 밖에서 들어온다
  #
  # 기본값이 0.0.0.0 이므로 PaaS 는 아무것도 안 해도 되고,
  # 직접 띄울 때만 SERVER_ADDRESS=127.0.0.1 을 준다(deploy/moirai.env.example).

# 관리자 계정.
#
# 기본값을 일부러 주지 않는다. application.yml 쪽은 ${ADMIN_PASSWORD:admin} 이라
# 환경변수를 깜빡해도 조용히 admin/admin 으로 뜬다. 로컬에서는 그게 편하지만
# 운영에서 같은 일이 벌어지면 관리 화면이 통째로 열린다.
#
# 여기서는 기본값 없이 두어, 환경변수가 없으면 부팅 자체가 실패하게 한다.
# 비밀번호가 틀린 채로 뜨는 것보다 아예 안 뜨는 쪽이 낫다.
#
# 값은 여기 적지 않는다. 이 파일은 깃에 들어간다.
app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

logging:
  level:
    com.dbrlwns.classic: INFO
