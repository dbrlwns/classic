spring:
  application:
    name: classic

  # 스키마는 Flyway 가 만들고 Hibernate 는 검사만 한다.
  #
  # create-drop 이던 시절에는 기동할 때마다 전부 지워졌다. 관리 화면에서 넣은
  # 곡과 스토리가 재시작 한 번에 사라졌고, 그래서 영상 ID 를 data.sql 로 받아
  # 적는 화면까지 따로 있었다. 그 우회로가 이제 필요 없다.
  #
  # validate 는 엔티티와 실제 스키마가 어긋나면 부팅을 막는다. 만드는 쪽(Flyway)과
  # 검사하는 쪽(Hibernate)이 독립적이라, 마이그레이션을 쓰면서 엔티티를 깜빡하면
  # 잘못된 스키마로 도는 대신 그 자리에서 멈춘다.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # 파일 DB. 재시작해도 데이터가 남는다.
  #
  # ./data 는 .gitignore 에 있다. 바이너리라 깃에 넣으면 지저분해지고,
  # 무엇보다 이제 콘텐츠의 원본이 이 파일이므로 가끔 복사해 두는 편이 좋다.
  #
  # AUTO_SERVER=TRUE 는 앱이 떠 있는 동안에도 다른 도구(DB 뷰어 등)가
  # 같은 파일에 붙을 수 있게 한다. 이게 없으면 "Database may be already in use" 다.
  datasource:
    url: jdbc:h2:file:./data/moirai;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 마이그레이션. src/main/resources/db/migration 의 V 파일을 번호순으로 실행하고,
  # 어디까지 돌렸는지 flyway_schema_history 에 기록한다.
  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

server:
  port: 8080

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

logging:
  level:
    com.dbrlwns.classic: DEBUG
