spring:
  application:
    name: classic

  # 1단계: 스키마가 계속 흔들리는 동안은 create-drop 으로 깨끗하게 새로 만든다.
  # update 는 컬럼을 추가만 하고 rename/삭제/타입변경을 반영하지 않아 스키마가 조용히 썩는다.
  # 진짜 콘텐츠를 넣기 시작하는 날 Flyway 를 도입하고 ddl-auto 를 validate 로 바꾼다.
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # data.sql 을 Hibernate 의 스키마 생성 "뒤에" 실행한다.
    # 이 값이 false(기본값)면 테이블이 만들어지기 전에 data.sql 이 돌아
    # "Table not found" 로 부팅이 실패한다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:h2:mem:classic;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

  # 시드 데이터. 매 기동마다 실행되지만 ddl-auto 가 create-drop 이라 중복이 쌓이지 않는다.
  #
  # 순서가 중요하다. data.sql 이 곡을 INSERT 하고, data-stories.sql 이 그 곡의
  # story 를 UPDATE 한다. data-locations 를 지정하면 기본 경로가 무시되므로
  # data.sql 도 명시해야 한다.
  sql:
    init:
      mode: always
      data-locations:
        - classpath:data.sql
        - classpath:data-stories.sql

server:
  port: 8080

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

logging:
  level:
    com.dbrlwns.classic: DEBUG
