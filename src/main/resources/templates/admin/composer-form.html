<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('작곡가 편집')}"></head>
<body class="admin-body">
<main class="container" style="padding-top:28px;">
    <nav th:replace="~{admin/_nav :: nav}"></nav>

    <h1 style="font-size:24px;" th:text="${form.id == null} ? '작곡가 추가' : '작곡가 수정'">작곡가</h1>

    <form method="post" th:action="@{/admin/composers/save}" th:object="${form}">
        <input type="hidden" th:field="*{id}">

        <div class="row">
            <div class="field">
                <label for="name">이름</label>
                <input type="text" id="name" th:field="*{name}" placeholder="클로드 드뷔시">
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="field">
                <label for="nameEn">원어/영문 이름</label>
                <input type="text" id="nameEn" th:field="*{nameEn}" placeholder="Claude Debussy">
            </div>
        </div>

        <div class="field">
            <label for="slug">슬러그</label>
            <input type="text" id="slug" th:field="*{slug}" placeholder="debussy">
            <div class="hint">URL 에 쓰입니다. 영문 소문자와 하이픈만 쓰세요.</div>
            <div class="error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
        </div>

        <div class="row">
            <div class="field">
                <label for="bornYear">출생 연도</label>
                <input type="number" id="bornYear" th:field="*{bornYear}" placeholder="1862">
            </div>
            <div class="field">
                <label for="diedYear">사망 연도</label>
                <input type="number" id="diedYear" th:field="*{diedYear}" placeholder="1918">
                <div class="hint">1962년 이전 사망이면 악곡은 퍼블릭 도메인입니다. 음원의 권리는 별개입니다.</div>
            </div>
        </div>

        <div class="field">
            <label for="bio">소개 (Markdown)</label>
            <textarea id="bio" th:field="*{bio}"></textarea>
        </div>

        <button class="btn" type="submit">저장</button>
        <a class="btn secondary" th:href="@{/admin/composers}">취소</a>
    </form>
</main>
</body>
</html>
