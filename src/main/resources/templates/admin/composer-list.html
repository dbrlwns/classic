<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('작곡가 관리')}"></head>
<body class="admin-body">
<main class="container" style="padding-top:28px;">
    <nav th:replace="~{admin/_nav :: nav}"></nav>

    <div class="flash" th:if="${message}" th:text="${message}"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;">
        <h1 style="font-size:24px;">작곡가</h1>
        <a class="btn small" th:href="@{/admin/composers/new}">작곡가 추가</a>
    </div>

    <table>
        <thead>
        <tr><th>이름</th><th>생몰</th><th>악곡 저작권</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="composer : ${composers}">
            <td>
                <span th:text="${composer.name}">이름</span>
                <div style="color:var(--text-muted);font-size:12px;" th:text="${composer.nameEn}"></div>
            </td>
            <td th:text="${composer.lifespan}"></td>
            <td>
                <span class="badge on" th:if="${composer.publicDomain}">퍼블릭 도메인</span>
                <span class="badge off" th:unless="${composer.publicDomain}">보호 대상 — 확인 필요</span>
            </td>
            <td><a class="btn secondary small" th:href="@{'/admin/composers/' + ${composer.id} + '/edit'}">수정</a></td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(composers)}" class="empty">등록된 작곡가가 없습니다.</p>
</main>
</body>
</html>
