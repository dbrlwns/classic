<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('작곡가')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container">
    <h1>작곡가</h1>

    <div th:if="${#lists.isEmpty(composers)}" class="empty">아직 등록된 작곡가가 없습니다.</div>

    <ul class="work-list">
        <li class="work-card" th:each="composer : ${composers}">
            <!-- .work-card 가 flex 라 직접 자식은 가로로 늘어선다. body 로 감싸 한 칸을 쓴다. -->
            <div class="work-card-body">
                <h2><a th:href="@{'/composers/' + ${composer.slug}}" th:text="${composer.name}">이름</a></h2>
                <p class="meta">
                    <span th:if="${composer.nameEn}" th:text="${composer.nameEn}"></span>
                    <span th:text="' ' + ${composer.lifespan}"></span>
                </p>
            </div>
        </li>
    </ul>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
