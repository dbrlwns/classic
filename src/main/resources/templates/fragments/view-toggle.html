<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  목록형 / 격자형 전환 버튼.

  메인과 작곡가 상세 두 곳에서 쓴다. 전에는 양쪽에 같은 마크업을 적어
  뒀는데, 아이콘이 들어오면서 한 벌이 길어져 한 군데로 모았다.

  아이콘은 인라인 SVG 다. 글리프(☰ ▦ 같은 문자)를 쓰면 EB Garamond 에도
  나눔명조에도 없어 엉뚱한 서체로 떨어진다. ❦ 에서 한 번 겪은 일이다.
  fill 을 currentColor 로 두면 버튼의 글자색을 따라가므로, 눌린 상태의
  강조색이 아이콘에도 그대로 적용된다.

  글자가 사라졌으므로 이름은 aria-label 이 맡는다. title 은 마우스를
  올렸을 때 뜨는 풍선말이다. 아이콘만 있는 버튼에서는 둘 다 필요하다.
  SVG 는 장식이므로 aria-hidden, focusable="false" 로 접근성 트리와
  탭 순서에서 빼 둔다(IE 시절 SVG 가 탭 대상이 되던 것의 잔재다).
-->
<div class="view-toggle" th:fragment="toggle">
    <button type="button" data-view-set="list" aria-pressed="true"
            aria-label="목록형으로 보기" title="목록형">
        <svg class="view-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="1" y="3" width="14" height="2"></rect>
            <rect x="1" y="7" width="14" height="2"></rect>
            <rect x="1" y="11" width="14" height="2"></rect>
        </svg>
    </button>
    <button type="button" data-view-set="grid" aria-pressed="false"
            aria-label="격자형으로 보기" title="격자형">
        <!-- 실제 격자는 3열이지만, 15px 짜리 아이콘에서 3x3 은 점처럼 뭉친다.
             2x2 가 격자를 뜻하는 가장 익은 모양이기도 하다. -->
        <svg class="view-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="1" y="1" width="6" height="6"></rect>
            <rect x="9" y="1" width="6" height="6"></rect>
            <rect x="1" y="9" width="6" height="6"></rect>
            <rect x="9" y="9" width="6" height="6"></rect>
        </svg>
    </button>
</div>

</body>
</html>
