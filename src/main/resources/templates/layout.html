<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Moirai'">Moirai</title>

    <!-- 초안 미리보기처럼 색인되면 안 되는 화면에서만 컨트롤러가 noindex 를 켠다.
         값을 안 넣은 화면에서는 null 이라 이 줄이 아예 나가지 않는다. -->
    <meta th:if="${noindex}" name="robots" content="noindex">

    <!--
      본문 서체. 라틴은 EB Garamond(16세기 가라몽 복각), 한글은 나눔명조.

      preconnect 두 줄은 폰트 파일을 받을 도메인에 미리 연결을 열어 둔다.
      CSS 를 받은 뒤에야 gstatic 연결을 시작하면 그만큼 늦어진다.

      한글 폰트는 용량이 크지만 Google Fonts 가 유니코드 구간별로 쪼개 보내므로
      실제로 내려받는 양은 쓰이는 글자 범위에 한정된다. display=swap 이라
      폰트가 늦어도 글이 먼저 보인다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nanum+Myeongjo:wght@400;700;800&display=swap">

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!--
      테마를 그려지기 전에 정한다.

      이 스크립트는 반드시 <head> 안에서, 외부 파일이 아니라 인라인으로
      돌아야 한다. 본문이 뜬 뒤에 data-theme 을 붙이면 어두운 화면을 고른
      사람에게 밝은 화면이 한 번 번쩍이고 어두워진다(FOUC).

      has-js 는 토글 버튼을 보이게 하는 열쇠다. 스크립트가 막힌 환경에서는
      눌러도 아무 일이 없는 버튼이 뜨지 않는다.
    -->
    <script th:inline="none">
        (function () {
            var el = document.documentElement;
            el.classList.add('has-js');
            var stored = null;
            try {
                stored = localStorage.getItem('moirai-theme');
            } catch (e) {
                // 사생활 보호 모드나 쿠키 차단에서는 localStorage 접근 자체가 던진다.
                // 그 경우 운영체제 설정을 따른다.
            }
            if (stored !== 'light' && stored !== 'dark') {
                stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                el.setAttribute('data-theme-source', 'system');
            } else {
                el.setAttribute('data-theme-source', 'user');
            }
            el.setAttribute('data-theme', stored);
        })();
    </script>

    <!-- 버튼을 누르는 쪽. defer 라 문서를 다 읽은 뒤에 돈다.
         head 조각에 두는 이유는 모든 화면이 이 조각을 쓰기 때문이다.
         body 끝에 두면 템플릿마다 따로 불러 줘야 한다. -->
    <script th:src="@{/js/theme.js}" defer></script>
</head>
<body>

<header class="site-header" th:fragment="header">
    <div class="container">
        <a class="site-title" th:href="@{/}">Moirai</a>
        <nav class="site-nav">
            <a th:href="@{/}">곡</a>
            <a th:href="@{/composers}">작곡가</a>
            <a th:href="@{/listen}">이어 듣기</a>
            <a th:href="@{/admin}" sec:authorize="isAuthenticated()">관리</a>

            <!-- 아이콘은 "지금 상태" 가 아니라 "누르면 가는 곳" 을 그린다.
                 밝을 때 초승달, 어두울 때 해. data-mode 와 라벨은 theme.js 가 채운다. -->
            <button th:replace="~{fragments/theme-toggle :: toggle}"></button>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="container">
        <!-- 모이라이는 그리스 신화에서 실을 잣고, 길이를 재고, 끊는 세 여신이다.
             이름의 고리는 "운명"이 아니라 "실"이다. 음악에서 선율을 line 이라 부르는 것과
             같은 자리다. 운명 교향곡 쪽으로 가면 베토벤 한 곡에 묶여 좁아진다. -->
        <p class="footer-tagline">
            Moirai — 모든 곡은 하나의 실이다. 시작되고, 이어지고, 끝난다.
            그 사이에 무슨 일이 있었는지를 적는다.
        </p>
        <p>악곡은 퍼블릭 도메인이며, 음원은 각 출처의 라이선스를 따릅니다. 유튜브 음원은 임베드로만 재생됩니다.</p>
    </div>
</footer>

</body>
</html>
