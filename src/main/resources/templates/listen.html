<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('이어 듣기')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container listen-page">

    <div th:if="${#lists.isEmpty(tracks)}" class="empty">
        <p>이어 들을 수 있는 곡이 아직 없습니다.</p>
        <p>유튜브 음원이 붙은 곡이 있어야 재생할 수 있습니다.</p>
    </div>

    <div class="listen-layout" th:if="${!#lists.isEmpty(tracks)}">

        <!-- 플레이어는 한 자리에 고정된다. 곡이 끝나면 여기에 다음 곡이 올라온다. -->
        <section class="listen-main" aria-label="재생 중">
            <div class="player-frame" id="listen-player"></div>

            <p class="listen-notice" id="listen-notice"></p>

            <div class="listen-controls">
                <button type="button" id="listen-prev" class="btn secondary small">← 이전</button>
                <button type="button" id="listen-next" class="btn secondary small">다음 →</button>
                <button type="button" id="listen-restart" class="btn secondary small">처음부터</button>
            </div>

            <div class="now-playing">
                <h1 id="now-title">제목</h1>
                <p class="meta" id="now-meta">작곡가</p>
                <p class="now-performer" id="now-performer"></p>
                <p class="now-summary" id="now-summary"></p>
                <p class="now-link"><a id="now-link" href="#">이 곡의 이야기 읽기 →</a></p>
            </div>
        </section>

        <!-- 연도순. 메인 목록과 같은 순서다. -->
        <aside class="listen-side" aria-label="재생 목록">
            <h2>재생 목록 <span class="listen-count" th:text="${#lists.size(tracks)} + '곡'"></span></h2>
            <ol class="listen-list" id="listen-list">
                <li th:each="track, it : ${tracks}"
                    th:attr="data-track-index=${it.index}"
                    tabindex="0">
                    <span class="listen-year" th:text="${track.year} ?: '—'">연도</span>
                    <span class="listen-track">
                        <span class="listen-title" th:text="${track.title}">제목</span>
                        <span class="listen-composer" th:text="${track.composerName}">작곡가</span>
                    </span>
                </li>
            </ol>
        </aside>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

<script th:src="@{/js/player.js}"></script>
<!--
  Thymeleaf 의 자바스크립트 인라이닝이 JSON 직렬화와 이스케이프를 처리한다.
  문자열을 직접 이어 붙이면 제목에 따옴표나 </script> 가 들어왔을 때 깨진다.

  CDATA 로 감싸거나 /*[[...]]*/ 형태의 프로토타입 주석을 쓰면 인라이닝이
  동작하지 않고 객체의 toString() 이 그대로 나온다. 아래가 표준 형식이다.
-->
<script th:if="${!#lists.isEmpty(tracks)}" th:inline="javascript">
    window.MOIRAI_TRACKS = [[${tracks}]];
</script>
<script th:if="${!#lists.isEmpty(tracks)}" th:src="@{/js/listen.js}"></script>
</body>
</html>
