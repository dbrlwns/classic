<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head(${work.title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container">

    <!-- 초안을 라이브로 착각하는 것이 이 기능의 유일한 위험이다.
         글 위에, 눈에 띄게, 수정으로 바로 돌아갈 길과 함께 둔다. -->
    <div class="draft-banner" th:if="${draft}">
        <strong>초안</strong>
        <span>이 곡은 공개되지 않았습니다. 로그인한 상태에서만 보입니다.</span>
        <a th:href="@{'/admin/works/' + ${work.id} + '/edit'}">수정으로 →</a>
    </div>

    <div class="work-header">
        <h1 th:text="${work.title}">제목</h1>
        <p class="meta">
            <a th:href="@{'/composers/' + ${work.composer.slug}}" th:text="${work.composer.name}">작곡가</a>
            <span th:if="${work.catalog}" th:text="' · ' + ${work.catalog}"></span>
            <span th:if="${work.yearComposed}" th:text="' · ' + ${work.yearComposed}"></span>
            <span th:if="${work.titleOriginal}" th:text="' · ' + ${work.titleOriginal}"></span>
        </p>
    </div>

    <section class="player-shell"
             th:if="${recording != null}"
             th:classappend="${recording.sourceType.name() == 'SELF_HOSTED'} ? 'audio-only' : ''">
        <div class="player-frame"><div id="player"></div></div>

        <div class="player-meta">
            <span th:if="${recording.performer}" th:text="${recording.performer}">연주자</span>
            <span th:if="${recording.license}" th:text="${recording.license}">라이선스</span>
            <a th:if="${recording.sourceUrl}" th:href="${recording.sourceUrl}" target="_blank" rel="noopener">출처</a>
            <span th:if="${recording.attribution}" th:text="${recording.attribution}"></span>
        </div>

        <div class="player-error" id="player-error"></div>
    </section>

    <section class="player-shell" th:if="${recording == null}">
        <p style="margin:0;color:var(--text-muted);font-size:14px;">재생 가능한 음원이 아직 없습니다.</p>
    </section>

    <article class="story" th:utext="${storyHtml}"></article>

    <!--
      이전/다음 대신 같은 작곡가의 곡을 묶어 놓는다.
      제목순의 이전/다음은 자의적인 순서라 "다음 곡"에 필연성이 없는 반면,
      "같은 작곡가"는 묶음의 이유가 분명하고 썸네일이 있어 고를 수 있다.

      글을 다 읽은 자리에 나오므로 읽는 중에는 시야에 들어오지 않는다.
    -->
    <nav class="section related" th:if="${!#lists.isEmpty(siblings)}"
         aria-labelledby="related-heading">
        <h2 id="related-heading" th:text="${work.composer.name} + '의 다른 곡'">다른 곡</h2>

        <ul class="work-list related-list" data-view="grid">
            <li class="work-card" th:each="sibling : ${siblings}"
                th:with="rec=${sibling.playableRecording}">
                <div class="work-card-body">
                    <h3><a th:href="@{'/works/' + ${sibling.slug}}" th:text="${sibling.title}">제목</a></h3>
                    <p class="meta">
                        <span th:if="${sibling.catalog}" th:text="${sibling.catalog}"></span>
                        <!-- 작품 번호가 없으면 가운뎃점이 혼자 남는다("· 1888") -->
                        <span th:if="${sibling.yearComposed}"
                              th:text="${sibling.catalog != null} ? ' · ' + ${sibling.yearComposed} : ${sibling.yearComposed}"></span>
                    </p>
                    <p class="summary" th:if="${sibling.summary}" th:text="${sibling.summary}"></p>
                </div>

                <div th:replace="~{fragments/player :: facade(${sibling}, ${rec})}"></div>
                <div th:replace="~{fragments/player :: placeholder(${sibling}, ${rec})}"></div>
            </li>
        </ul>

        <p class="related-more">
            <a th:href="@{'/composers/' + ${work.composer.slug}}"
               th:text="${work.composer.name} + ' 전체 보기 →'">전체 보기</a>
        </p>
    </nav>
</main>

<footer th:replace="~{layout :: footer}"></footer>

<!-- player.js 와 하단 카드의 재생 버튼 처리를 함께 불러온다.
     아래 본문 플레이어 스크립트가 Classic 을 쓰므로 이 블록이 먼저 와야 한다. -->
<th:block th:replace="~{fragments/player :: script}"></th:block>
<script th:if="${recording != null}" th:inline="javascript">
    /*<![CDATA[*/
    var options = {
        sourceType: /*[[${recording.sourceType.name()}]]*/ 'YOUTUBE',
        youtubeId: /*[[${recording.youtubeId}]]*/ '',
        audioUrl: /*[[${recording.audioUrl}]]*/ '',
        startOffset: /*[[${recording.startOffset}]]*/ 0,
        endOffset: /*[[${recording.endOffset}]]*/ 0
    };

    var player = Classic.createPlayer(document.getElementById('player'), options);

    player.on('error', function (info) {
        var box = document.getElementById('player-error');
        box.textContent = info.message;
        box.style.display = 'block';
    });

    // 여기에 주석(Annotation) 하이라이트가 붙는다. 1단계에서는 비워둔다.
    // player.on('tick', function (seconds) { ... });
    /*]]>*/
</script>
</body>
</html>
