<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('곡')}"></head>
<!-- 첫 요소가 글이 아니라 조작 버튼인 화면. 헤더와의 간격을 줄인다. -->
<body class="toolbar-top">
<header th:replace="~{layout :: header}"></header>

<!-- 격자형일 때 폭을 넓히기 위해 JS 가 여기에도 data-view 를 붙인다.
     760px 는 글을 읽기에 맞는 폭이지만 격자에는 좁아 2열밖에 나오지 않는다. -->
<main class="container" id="works-main" data-view="list">
    <div th:if="${#lists.isEmpty(works)}" class="empty">
        <p>아직 공개된 곡이 없습니다.</p>
        <p><a th:href="@{/admin}">관리 화면</a>에서 첫 곡을 등록해 보세요.</p>
    </div>

    <!--
      보기 방식 전환. 레이아웃은 CSS 가 ul 의 data-view 를 보고 결정하고,
      마크업은 한 벌만 쓴다. 격자에서 썸네일을 위로 올리는 것은 order 로 처리한다.

      선택은 localStorage 에 저장한다. 보는 사람마다 다른 취향이고 서버가
      알 필요가 없는 값이다.
    -->
    <!-- th:if 를 th:replace 와 같은 태그에 달면 안 된다. th:replace 가 먼저
         실행되어(우선순위 100 대 300) 조건이 무시된다. th:block 으로 감싼다. -->
    <th:block th:if="${!#lists.isEmpty(works)}">
        <div th:replace="~{fragments/view-toggle :: toggle}"></div>
    </th:block>

    <!-- ul 이 파싱되기 전에 저장된 선택을 적용해 깜빡임을 막는다. -->
    <script th:src="@{/js/view-toggle.js}"></script>

    <ul class="work-list" id="work-list" data-view="list">
        <li class="work-card" th:each="work : ${works}" th:with="rec=${work.playableRecording}">

            <div class="work-card-body">
                <h2><a th:href="@{'/works/' + ${work.slug}}" th:text="${work.title}">제목</a></h2>
                <p class="meta">
                    <span th:text="${work.composer.name}">작곡가</span>
                    <span th:if="${work.catalog}" th:text="' · ' + ${work.catalog}"></span>
                    <span th:if="${work.yearComposed}" th:text="' · ' + ${work.yearComposed}"></span>
                </p>

                <!-- 격자형에서도 한 줄 소개를 남긴다. 이 문장이 빠지면 격자가
                     그냥 영상 목록이 된다. 읽을 거리가 주인공이라는 포지션을 지킨다. -->
                <p class="summary" th:if="${work.summary}" th:text="${work.summary}">한 줄 소개</p>

                <!-- and 안에서는 SpEL 이 Boolean 을 요구한다. 문자열을 그대로 두면
                     "cannot convert from java.lang.String to java.lang.Boolean" 이 난다. -->
                <p class="card-performer"
                   th:if="${rec != null and rec.performer != null}"
                   th:text="${rec.performer}"></p>
            </div>

            <!-- 각 프래그먼트가 rec 를 보고 자기를 그릴지 결정한다. -->
            <div th:replace="~{fragments/player :: facade(${work}, ${rec})}"></div>
            <div th:replace="~{fragments/player :: placeholder(${work}, ${rec})}"></div>

        </li>
    </ul>
</main>

<footer th:replace="~{layout :: footer}"></footer>

<th:block th:replace="~{fragments/player :: script}"></th:block>
</body>
</html>
